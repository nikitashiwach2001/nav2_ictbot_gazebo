# nav2_params_camera.yaml
# Camera-only navigation — NO LiDAR.
# Obstacle detection uses /camera/depth_camera/points (PointCloud2) instead of /scan.
# Used by visual_navigation_camera.launch.py and vslam_camera.launch.py.
#
# Differences from nav2_params.yaml (LiDAR version):
#   - obstacle_layer observation source changed from LaserScan(/scan) → PointCloud2(/camera/depth_camera/points)
#   - min_obstacle_height / max_obstacle_height added to filter floor and ceiling from depth cloud
#   - amcl section removed (RTAB-Map replaces AMCL for localization)
#   - slam_toolbox section removed (RTAB-Map replaces slam_toolbox for SLAM)

# default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
# default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.5
    groot_monitoring: false
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    bt_loop_duration: 10          # ms per BT tick
    server_timeout: 20            # seconds to wait for action/service calls — fixes costmap clear timeout

    default_nav_to_pose_bt_xml: "/home/user/Documents/ros2_ws_ict_nav2/src/ict_bot_nav/config/navigate_to_pose_w_replanning_and_recovery.xml"
    # default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_goal_patience_and_recovery.xml"  # too aggressive replanning with depth camera
    default_nav_through_poses_bt_xml: "/home/user/Documents/ros2_ws_ict_nav2/src/ict_bot_nav/config/navigate_to_pose_w_replanning_and_recovery.xml"


waypoint_follower:
  ros__parameters:
    loop_rate: 20
    use_sim_time: True
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

controller_server:
  ros__parameters:
    use_sim_time: True
    robot_base_frame: base_footprint
    # controller_frequency: 10.0   # too high — misses rate due to RTAB-Map CPU load
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 3.0    # was 15s — triggers recovery faster when stuck

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      # yaw_goal_tolerance: 0.25    # too tight — robot reached position but failed heading match
      yaw_goal_tolerance: 3.14      # ignore final heading — position-only goal check
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      allow_reversing: true
      # use_rotate_to_heading: false
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0
      rotate_to_heading_min_angle: 0.785

planner_server:
  ros__parameters:
    use_sim_time: True
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # plugin: "nav2_smac_planner/SmacPlannerHybrid"  # cost-aware — creates loop paths in tight corridors with overlapping inflation
      # tolerance: 0.25
      # allow_unknown: false
      # max_iterations: 1000000
      # max_on_approach_iterations: 1000
      # max_planning_time: 3.0
      # cost_travel_multiplier: 1.5
      plugin: "nav2_navfn_planner/NavfnPlanner"   # shortest geometric path — no loop issue in tight corridors
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    robot_base_frame: base_footprint
    local_frame: odom
    global_frame: map
    # behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # behavior_plugins: ["backup", "spin", "drive_on_heading", "wait"]
    # behavior_plugins: ["clear_costmap_local", "wait", "backup"]   # clear_costmap_local is not a valid behavior plugin — handled in BT XML
    # behavior_plugins: ["backup", "backup_far", "drive_on_heading", "spin", "wait"]
    behavior_plugins: ["backup", "wait", "drive_on_heading"]   # order defined in BT XML — clear costmap → wait → backup → backup_far → spin → wait
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.3        # back up 30cm — first attempt
      backup_speed: 0.05      # slow reverse
      time_allowance: 10.0
    # backup_far:
    #   plugin: "nav2_behaviors/BackUp"
    #   backup_dist: 0.5        # back up 50cm — second attempt, more clearance
    #   backup_speed: 0.05
    #   time_allowance: 10.0
    # spin:
    #   plugin: "nav2_behaviors/Spin"
    # backup:                          # duplicate removed — defined above with custom dist/speed
    #   plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.15
      footprint_padding: 0.04
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # ── LiDAR primary + Camera for close obstacles ─────────────────────
        # observation_sources: depth_camera   # camera only — noisy, causes false obstacles
        observation_sources: scan depth_camera
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          observation_persistence: 1.0
        depth_camera:
          topic: /camera/depth_camera/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.15      # raised from 0.05 — filters floor noise and low reflections
          max_obstacle_height: 1.2
          obstacle_max_range: 2.0        # reduced from 3.0 — less noise from far depth readings
          obstacle_min_range: 0.2
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          observation_persistence: 1.0   # reduced from 3.0 — clears ghost obstacles faster
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor: 5.0
        # inflation_radius: 0.28
        cost_scaling_factor: 5.0   
        inflation_radius: 0.19      # just slightly over robot radius (0.15m) — keeps corridors open
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.15
      footprint_padding: 0.04
      resolution: 0.05
      track_unknown_space: true
      # Global costmap uses ONLY the static RTAB-Map map — no live clearing.
      # Chairs/desks marked in the map stay permanently occupied.
      # Live dynamic obstacle detection is handled by the local costmap only.
      plugins: ["static_layer", "inflation_layer"]   # reverted — live obstacle layer caused loop paths in tight office (inflation merged into large blobs)
      # plugins: ["static_layer", "obstacle_layer", "inflation_layer"]   # live LiDAR — caused figure-8 loop paths
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          obstacle_max_range: 6.0
          raytrace_max_range: 6.5
          observation_persistence: 0.0   # 0 = only current scan — no ghost obstacles

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor: 10.0
        # inflation_radius: 0.35
        cost_scaling_factor: 10.0    # soft falloff — planner avoids walls but not aggressively
        inflation_radius: 0.18      # reduced from 0.35 — office too congested for large inflation
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0